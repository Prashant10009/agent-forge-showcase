name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: zip -r agent-forge-dossier-${{ github.ref_name }}.zip dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "agent-forge-dossier-${GITHUB_REF_NAME}.zip" --generate-notes --title "Agent Forge Engineering Dossier ${GITHUB_REF_NAME}"
