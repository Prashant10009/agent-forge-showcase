name: Showcase bug
description: Report a reproducible problem in the public demo, documentation, or checks.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include private Agent Forge data, credentials, screenshots, or production details.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the public showcase behavior only.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser or environment
