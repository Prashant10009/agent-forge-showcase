<svg xmlns="http://www.w3.org/2000/svg" width="320" height="80" viewBox="0 0 320 80" role="img" aria-labelledby="title desc">
  <title id="title">Agent Forge topbar lockup</title>
  <desc id="desc">Animated Agent Forge mark and Forge wordmark for application topbars.</desc>
  <style>.mark{transform-origin:44px 42px;animation:spin 3s linear infinite,fire 2.4s ease-in-out infinite alternate}@keyframes spin{to{transform:rotate(360deg)}}@keyframes fire{0%{fill:#ff2200}25%{fill:#ff6600}50%{fill:#ff4500}75%{fill:#cc1100}100%{fill:#ff2200}}@media(prefers-reduced-motion:reduce){.mark{animation:none;fill:#ff4500}}</style>
  <rect x="1" y="1" width="318" height="78" rx="12" fill="#0d0d12" stroke="#1f1f2e"/>
  <svg x="22" y="28" width="28" height="24" viewBox="0 0 88 76">
    <path class="mark" d="M44,8 L84,76 L68,76 L68,65 L20,65 L20,76 L4,76 Z M20,60 L68,60 L68,57 L20,57 Z" fill="#ff4500" fill-rule="evenodd"/>
  </svg>
  <text x="70" y="49" fill="#e2dede" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" letter-spacing="4">FORGE</text>
</svg>
