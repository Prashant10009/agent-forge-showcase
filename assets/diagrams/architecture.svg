<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Agent Forge public architecture</title>
  <desc id="desc">A four-layer architecture connecting product experiences to orchestration, intelligence and governance, and replaceable runtimes.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="20" x2="1120" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14161A"/><stop offset="1" stop-color="#08090B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFE39A"/><stop offset="1" stop-color="#D48A22"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter>
    <style>
      .layer{fill:#111318;stroke:#333740;stroke-width:1.5}.card{fill:#181B21;stroke:#414650;stroke-width:1.2}.hot{fill:#241B0E;stroke:#9A6728;stroke-width:1.5}.label{fill:#9A9FA9;font:600 14px ui-monospace,monospace;letter-spacing:2px}.title{fill:#F4F1EA;font:700 22px system-ui,sans-serif}.copy{fill:#B9BDC5;font:500 14px system-ui,sans-serif}.path{stroke:url(#accent);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:7 9}.node{fill:#F2B84B}.private{fill:#817765;font:500 12px ui-monospace,monospace}
    </style>
  </defs>
  <rect width="1200" height="720" rx="30" fill="url(#bg)"/>
  <circle cx="930" cy="110" r="120" fill="#C98120" opacity=".09" filter="url(#soft)"/>
  <text x="64" y="60" class="label">PUBLIC SYSTEM MAP · PORTFOLIO EDITION</text>
  <text x="64" y="96" class="title">One governed path from intent to verified result</text>

  <rect x="64" y="132" width="1072" height="112" rx="18" class="layer"/>
  <text x="88" y="162" class="label">01 · EXPERIENCE</text>
  <rect x="88" y="178" width="236" height="42" rx="10" class="card"/><text x="108" y="204" class="copy">Chat + mission graph</text>
  <rect x="340" y="178" width="236" height="42" rx="10" class="card"/><text x="360" y="204" class="copy">Approval manifests</text>
  <rect x="592" y="178" width="236" height="42" rx="10" class="card"/><text x="612" y="204" class="copy">Data Grid + projects</text>
  <rect x="844" y="178" width="268" height="42" rx="10" class="card"/><text x="864" y="204" class="copy">Traces + system health</text>

  <rect x="64" y="264" width="1072" height="126" rx="18" class="layer"/>
  <text x="88" y="294" class="label">02 · ORCHESTRATION</text>
  <rect x="88" y="312" width="188" height="52" rx="11" class="hot"/><text x="108" y="344" class="copy">Intent intake</text>
  <rect x="302" y="312" width="188" height="52" rx="11" class="card"/><text x="322" y="344" class="copy">Context builder</text>
  <rect x="516" y="312" width="188" height="52" rx="11" class="card"/><text x="536" y="344" class="copy">Plan driver</text>
  <rect x="730" y="312" width="188" height="52" rx="11" class="card"/><text x="750" y="344" class="copy">Tool dispatcher</text>
  <rect x="944" y="312" width="168" height="52" rx="11" class="hot"/><text x="964" y="344" class="copy">Verifier</text>

  <rect x="64" y="410" width="1072" height="126" rx="18" class="layer"/>
  <text x="88" y="440" class="label">03 · INTELLIGENCE + GOVERNANCE</text>
  <rect x="88" y="458" width="236" height="52" rx="11" class="card"/><text x="108" y="490" class="copy">Dynamic model routing</text>
  <rect x="340" y="458" width="236" height="52" rx="11" class="hot"/><text x="360" y="490" class="copy">Policy + human approval</text>
  <rect x="592" y="458" width="236" height="52" rx="11" class="card"/><text x="612" y="490" class="copy">Outcome learning</text>
  <rect x="844" y="458" width="268" height="52" rx="11" class="card"/><text x="864" y="490" class="copy">Council review + memory</text>

  <rect x="64" y="556" width="1072" height="104" rx="18" class="layer"/>
  <text x="88" y="586" class="label">04 · REPLACEABLE RUNTIMES</text>
  <rect x="88" y="604" width="236" height="34" rx="9" class="card"/><text x="108" y="626" class="copy">Model adapters</text>
  <rect x="340" y="604" width="236" height="34" rx="9" class="card"/><text x="360" y="626" class="copy">MCP + A2A tools</text>
  <rect x="592" y="604" width="236" height="34" rx="9" class="card"/><text x="612" y="626" class="copy">Vector + durable memory</text>
  <rect x="844" y="604" width="268" height="34" rx="9" class="card"/><text x="864" y="626" class="copy">Telemetry + evaluation</text>

  <path d="M184 244V264M396 390V410M610 536V556M1028 390V410" class="path"/>
  <circle cx="184" cy="254" r="4" class="node"/><circle cx="396" cy="400" r="4" class="node"/><circle cx="610" cy="546" r="4" class="node"/><circle cx="1028" cy="400" r="4" class="node"/>
  <text x="64" y="694" class="private">PUBLIC ABSTRACTIONS ONLY · PRODUCTION POLICIES, DATA AND INFRASTRUCTURE ARE NOT INCLUDED</text>
</svg>
